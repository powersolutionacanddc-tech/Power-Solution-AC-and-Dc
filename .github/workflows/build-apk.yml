
name: Build POWER SOLUTIONS AC & DC APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract Android project
        run: unzip -q Power_Solutions_AC_DC_Android_Studio_Project_UPDATED.zip -d project
      - name: Build Android APK
        run: |
          cd project/PowerSolutionsAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Power-Solutions-AC-DC-APK
          path: project/PowerSolutionsAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
